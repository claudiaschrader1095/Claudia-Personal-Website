<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Selected web design, quality engineering, branding, and experience projects by Claudia.">
    <link rel="canonical" href="https://www.cultivatedbyclaudia.com/work">
    <title>Work — Claudia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="page-shell">
    <header th:replace="~{fragments/header :: site-header}"></header>

    <main>
        <section class="page-intro section reveal">
            <p class="eyebrow">Selected work</p>
            <h1>A little bit technical.<br>A little bit magical.</h1>
            <p>A collection of website, quality engineering, branding, and experience concepts shaped by curiosity, strategy, and attention to detail.</p>
        </section>

        <section class="section work-section page-section-start">
            <div class="project-grid">
                <article class="project-card reveal" th:each="project : ${projects}" th:classappend="${project.featured} ? ' featured' : ''">
                    <div class="project-content">
                        <p class="project-category" th:text="${project.category}">Category</p>
                        <h2 th:text="${project.title}">Project title</h2>
                        <p th:text="${project.description}">Project description</p>
                        <span class="project-tech" th:text="${project.technology}">Technology</span>
                    </div>
                    <a th:href="${project.link}" class="project-image">
                        <video th:if="${project.image.endsWith('.mov')}" th:src="${project.image}" autoplay muted loop playsinline></video>
                        <img th:unless="${project.image.endsWith('.mov')}" th:src="${project.image}" th:alt="${project.title}">
                        <span class="project-arrow" aria-hidden="true">↗</span>
                    </a>
                </article>
            </div>
        </section>
    </main>

    <footer th:replace="~{fragments/footer :: site-footer}"></footer>
</div>
<script th:src="@{/js/script.js}"></script>
</body>
</html>
